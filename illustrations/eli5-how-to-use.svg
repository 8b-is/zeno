<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 220" role="img" aria-labelledby="title-steps desc-steps">
  <title id="title-steps">ELI5 Four Zen Stepping Stones to Use ZENO</title>
  <desc id="desc-steps">A flowing golden stream linking four Japanese garden stepping stones: Step 1 Open App with Zero Cookies, Step 2 Check 1:1 Reserves, Step 3 Send with $zenotag or QR, and Step 4 Pick a Pro Plan via Stripe or Direct USDC.</desc>
  <rect width="760" height="220" rx="22" fill="#0b0f16" stroke="#1e2a3a" stroke-width="1"/>
  <path d="M 36 1 H 724" stroke="#e8b05c" stroke-width="1" opacity="0.5"/>

  <!-- Flowing stream connecting stepping stones -->
  <path d="M 98 112 C 168 74, 212 148, 286 112 C 360 76, 404 148, 474 112 C 544 76, 588 148, 662 112"
