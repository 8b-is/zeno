  <text x="40" y="144" fill="#93a1b2" font-family="sans-serif" font-size="11">No signup, 0 cookies.</text>
  <text x="40" y="166" fill="#4ecdc4" font-family="monospace" font-size="10">ECDSA P-256 IN BROWSER</text>

