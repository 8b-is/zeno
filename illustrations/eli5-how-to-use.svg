  <rect x="208" y="42" width="160" height="140" rx="18" fill="#101722" stroke="#00d47e" stroke-width="1.4"/>
  <circle cx="236" cy="70" r="14" fill="#072219" stroke="#00d47e" stroke-width="1.3"/>
