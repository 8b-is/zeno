<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- Sumi Background -->
  <rect width="128" height="128" rx="26" fill="#07080B"/>

  <!-- 11 Constellation Stars around perimeter -->
  <g fill="#EDEBF2">
    <circle cx="64" cy="10" r="3"/>
    <circle cx="93" cy="16" r="2.8" fill="#E8B05C"/>
    <circle cx="113" cy="36" r="2.8"/>
    <circle cx="118" cy="65" r="3" fill="#62E6C9"/>
    <circle cx="110" cy="94" r="2.8"/>
    <circle cx="89" cy="113" r="3" fill="#E8B05C"/>
    <circle cx="59" cy="118" r="2.8"/>
    <circle cx="31" cy="110" r="3" fill="#B48BFF"/>
    <circle cx="14" cy="88" r="2.8"/>
    <circle cx="11" cy="57" r="3" fill="#62E6C9"/>
    <circle cx="26" cy="27" r="2.8" fill="#E8B05C"/>
  </g>

  <!-- Ensō-style Teal Circle (bold brush arc) -->
  <path d="M 88 28 A 43 43 0 1 0 105 76" fill="none" stroke="#62E6C9" stroke-width="10" stroke-linecap="round"/>

  <!-- Gold Kintsugi Repair Seams crossing the Teal Circle -->
  <g fill="none" stroke="#E8B05C" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 22 44 L 38 52 L 46 47"/>
    <path d="M 94 22 L 103 44 L 112 58 L 101 79"/>
    <path d="M 46 95 L 54 109 L 66 114"/>
    <path d="M 79 88 L 93 101"/>
  </g>

  <!-- One Violet ZKP1 Stitch Line -->
  <path d="M 18 78 L 42 70 L 86 56 L 112 48" fill="none" stroke="#B48BFF" stroke-width="4.5" stroke-linecap="round" stroke-dasharray="7 6"/>

  <!-- Centered Kanji 銭 -->
  <text x="64" y="80" text-anchor="middle" font-family="sans-serif" font-size="46" font-weight="900" fill="#EDEBF2">銭</text>
</svg>
