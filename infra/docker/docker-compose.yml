services:
  zeno:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile
    container_name: zeno-neo-bank
    ports:
      - "8089:8089"
    restart: unless-stopped
    environment:
      - ZENO_ENV=production
      - ZENO_PORT=8089
    volumes:
      - zeno-data:/var/lib/zeno

volumes:
  zeno-data:
