[package]
name = "zeno-wasm-client"
version = "0.1.0"
edition = "2024"
description = "Tiny zero-dependency #![no_std] client-side Rust WebAssembly core for ZENO US (MIT safe math & Solana validation)"
license = "MIT OR Apache-2.0"

[lib]
name = "zeno_wasm_client"
crate-type = ["cdylib", "rlib"]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
