[package]
name = "zeno-leptos-ui"
version = "0.1.0"
edition = "2024"
description = "Full client-side Rust (Leptos 0.8 CSR) reactive terminal for ZENO US at /us-rust"
license = "MIT OR Apache-2.0"

[lib]
name = "zeno_leptos_ui"
crate-type = ["cdylib", "rlib"]

[dependencies]
leptos = { version = "0.8", features = ["csr"] }
wasm-bindgen = "=0.2.130"
zeno-wasm-client = { path = "../zeno-wasm-client", default-features = false }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
