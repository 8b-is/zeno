openapi: 3.1.0
info:
  title: ZENO Sovereign Neo-Bank Edge API
  version: 1.0.0
  description: >
    REST and Edge API specification for Zeno (銭・禅・善), the Japanese
    proof-of-contribution sovereign neo-bank. Double-entry Kintsugi ledger,
    real-time micro-streaming, Foken valuation gate, and agent banking.
servers:
  - url: https://zeno.vaked.dev/api/v1
    description: Production Cloudflare Edge Gateway
  - url: http://localhost:8080/api/v1
    description: Local Dev Engine
paths:
  /accounts:
    get:
      summary: List registered accounts
      responses:
        '200':
          description: Array of active accounts
    post:
      summary: Create new account (Personal, Guild, Agent, Contributor)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [accountType, label, ownerAddress]
              properties:
                accountType:
                  type: string
                  enum: [personal, guild, contributor, agent]
                label:
                  type: string
                ownerAddress:
                  type: string
      responses:
        '201':
          description: Account created
  /accounts/{accountId}/balance:
    get:
      summary: Retrieve static and dynamic streaming balance
      parameters:
        - name: accountId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Current balance including computed micro-yen accrued
  /transfers:
    post:
      summary: Execute discrete double-entry transfer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fromAccount, toAccount, amount, currency]
              properties:
                fromAccount:
                  type: string
                toAccount:
                  type: string
                amount:
                  type: integer
                  description: Amount in base units (e.g. JPY)
                currency:
                  type: string
                  enum: [JPY, ZENO, FOKEN, USD]
                memo:
                  type: string
      responses:
        '200':
          description: Transfer executed and sealed into block
  /streams:
    get:
      summary: List active continuous streams
      responses:
        '200':
          description: Active streaming connections
    post:
      summary: Create continuous micro-stream
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fromAccount, toAccount, rateMicroYenPerSec]
              properties:
                fromAccount:
                  type: string
                toAccount:
                  type: string
                rateMicroYenPerSec:
                  type: integer
                  description: Micro-yen streamed per second
                durationSeconds:
                  type: integer
      responses:
        '201':
          description: Stream established
  /foken/gate:
    post:
      summary: Submit invoice to deterministic Foken valuation gate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Standard Foken Invoice JSON
      responses:
        '200':
          description: Verdict PASS, FAIL, or REVIEW with computed net-utility
  /foken/mint:
    post:
      summary: Execute mintFromConsensus upon reviewer quorum
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [invoiceId, contributor, consensusProof]
      responses:
        '200':
          description: Contributor balance credited and sealed

  # Stripe Compatibility Endpoints
  /stripe/webhook:
    post:
      summary: Intake and verify Stripe webhook events
      parameters:
        - name: Stripe-Signature
          in: header
          required: true
          schema:
            type: string
            example: t=1700000000,v1=5257a869e7ecebeda32affa62cdca3fa51cad7e77a0e56ff536d0ce8e108d8bd
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, type, data]
      responses:
        '200':
          description: Event ingested and ledger equilibrium recorded
        '400':
          description: Invalid signature or timestamp window exceeded

  /stripe/checkout-session:
    post:
      summary: Create Stripe hosted checkout session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [successUrl, cancelUrl, lineItems]
              properties:
                successUrl:
                  type: string
                cancelUrl:
                  type: string
                lineItems:
                  type: array
                  items:
                    type: object
                    required: [name, amountCents, currency, quantity]
                metadata:
                  type: object
      responses:
        '200':
          description: Checkout session created with redirect URL

  /stripe/metered-usage:
    post:
      summary: Report agent token or compute usage for metered billing
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [subscriptionItemId, quantity, agentId]
              properties:
                subscriptionItemId:
                  type: string
                quantity:
                  type: integer
                agentId:
                  type: string
                action:
                  type: string
                  enum: [increment, set]
                  default: increment
      responses:
        '200':
          description: Metered usage successfully reported

  /stripe/virtual-cards:
    post:
      summary: Issue ephemeral or merchant-locked virtual card via Stripe Issuing
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [agentId, spendLimitCents, currency, proofOfReasoning]
              properties:
                agentId:
                  type: string
                spendLimitCents:
                  type: integer
                currency:
                  type: string
                  enum: [usd, eur, jpy]
                  default: usd
                allowedCategories:
                  type: array
                  items:
                    type: string
                proofOfReasoning:
                  type: string
      responses:
        '201':
          description: Virtual card issued subject to agent policy

  # Agent Commerce Protocol (ACP) Endpoints
  /.well-known/acp.json:
    get:
      summary: Retrieve Agent Commerce Protocol capability manifest
      responses:
        '200':
          description: ACP node metadata, supported rails, and services

  /acp/rfq:
    post:
      summary: Submit Request for Quote (RFQ) to an agent peer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [requesterAgent, providerAgent, serviceType]
      responses:
        '201':
          description: RFQ registered and routed

  /acp/quote:
    post:
      summary: Issue programmatic quote in response to RFQ
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rfqId, providerAgent, priceMicroYen, paymentRail, validUntil]
      responses:
        '200':
          description: Quote generated and signed

  /acp/escrow:
    post:
      summary: Lock cryptographic escrow for accepted quote
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [quoteId, payerAgent, amountMicroYen]
      responses:
        '200':
          description: Escrow locked in double-entry ledger

  /acp/settle:
    post:
      summary: Finalize payment against Proof of Reasoning (PoR)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [quoteId, providerAgent, proofOfReasoning]
      responses:
        '200':
          description: Task verified and funds dispersed

