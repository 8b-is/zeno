  <line x1="1080" y1="0" x2="1080" y2="630" stroke="rgba(180, 139, 255, 0.06)" stroke-width="1"/>
  <line x1="0" y1="120" x2="1200" y2="120" stroke="rgba(180, 139, 255, 0.06)" stroke-width="1"/>
  <line x1="0" y1="510" x2="1200" y2="510" stroke="rgba(180, 139, 255, 0.06)" stroke-width="1"/>

